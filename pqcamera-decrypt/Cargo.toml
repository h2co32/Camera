[package]
name = "pqcamera-decrypt"
version = "1.0.0"
edition = "2021"
authors = ["GrapheneOS Camera Contributors"]
description = "Post-quantum photo decryption utility for GrapheneOS Camera"

[dependencies]
pqc_kyber = "0.7.1"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10.8"
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
anyhow = "1.0"

[[bin]]
name = "pqcamera-decrypt"
path = "src/main.rs"
